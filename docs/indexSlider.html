  <body>
    <div id="time-range">
      <link href="stylesheetSlider.css" rel="stylesheet" />

      <p>
        Time Range: <span class="slider-time">09:00</span> -
        <span class="slider-time2">17:00</span>
      </p>
      <div class="sliders_step1">
        <div id="slider-range">
          <script>
            // SLIDER 1 AND A HALF VERSION (COVERS 36 HOURS)
            //IMPORTANT --> TO CHECK IF IT'S CURRENT OR NEXT DAY --> CHECK IF VALUES[0] OR VALUES[1] IS GREATER THAN 1440
            // BELOW IS NORMAL VERSION
            $("#slider-range").slider({
              range: true,
              min: 0,
              max: 2160,
              step: 15,
              values: [540, 1020],
              slide: function (e, ui) {
                var hours1 = Math.floor(ui.values[0] / 60);
                var minutes1 = ui.values[0] - hours1 * 60;

                if (hours1.length == 1) hours1 = "0" + hours1;
                if (minutes1.length == 1) minutes1 = "0" + minutes1;
                if (minutes1 == 0) minutes1 = "00";
                if (hours1 == 0) {
                  //hours1 = 12;
                  hours1 = "00";
                  minutes1 = minutes1;
                }
                if (hours1 == 24) {
                  hours1 = 0;
                  minutes1 = minutes1;
                }

                $(".slider-time").html(hours1 + ":" + minutes1);

                var hours2 = Math.floor(ui.values[1] / 60);
                var minutes2 = ui.values[1] - hours2 * 60;

                if (hours2.length == 1) hours2 = "0" + hours2;
                if (minutes2.length == 1) minutes2 = "0" + minutes2;
                if (minutes2 == 0) minutes2 = "00";

                if (hours2 >= 24) {
                  hours2 = hours2 - 24;
                  minutes2 = minutes2;
                }

                $(".slider-time2").html(hours2 + ":" + minutes2);
              },
            });
