<div>
  <div class="home-container">
    <div class="home-container01">
      <div class="home-container02">
        <h1>Usage Cost Estimation</h1>
        <div class="home-container03">
          <div class="home-container04"><h2 class="home-text01">ETL</h2></div>
          <div class="home-container05">
            <h3 class="home-warehouse-size">Warehouse Size</h3>
            <span class="home-text02"><span>X-Small</span></span>
            <div id="warehouze-size-area" class="home-container06">

              <button
                id="warehouse-size-button-right"
                class="home-button01 button"
              >
                &gt;
              </button>
            </div>
          </div>
          <div class="home-container07">
            <input
              type="ETL Warehouse"
              placeholder="placeholder"
              id="etlnameinputfield"
              value="ETL Warehouse"
              class="input"
            />
            <div class="home-container-etl-days">
              <span class="home-text06">
                <span>Active Days</span>
                <span></span>
              </span>
              <button id="etlmondaybutton" class="home-button02 button">
                Mon.
              </button>
              <button id="etltuesdaybutton" class="home-button03 button">
                Tue.
              </button>
              <button id="etlwednesdaybutton" class="home-button04 button">
                Wed.
              </button>
              <button id="etlthursdaybutton" class="home-button05 button">
                Thu.
              </button>
              <button id="etlfridaybutton" class="home-button06 button">
                Fri.
              </button>
              <button id="etlsaturdaybutton" class="home-button07 button">
                Sat.
              </button>
              <button id="etlsundaybutton" class="home-button08 button">
                Sun.
              </button>
            </div>
            <div class="home-container-etl-frequency">
              <span class="home-e-l-t-e-t-l-frequency">
                <span>ELT / ETL Frequency</span>
              </span>
              <select id="etlfrequencyselector">
                <option value="Option 1">Every Hour</option>
                <option value="Option 2">Every 2 Hours</option>
                <option value="Option 3">Every 4 Hours</option>
              </select>
              <span class="home-duration-minutes">
                <span>Duration (Minutes)</span>
              </span>
              <input
                type="number"
                placeholder="placeholder"
                id="durationinputfield"
                value="1"
                class="input"
              />
            </div>
          </div>
          <div class="home-container08">
            <h1>Total</h1>
            <div class="home-container09">
              <span>
                <span>4 Credits/Hour</span>
                <br />
                <span>Used Hours 122</span>
                <br />
                <span>Total 487 credits</span>
              </span>
            </div>
            <button id="deleteall" type="reset" class="button">Delete</button>
          </div>
        </div>
      </div>
